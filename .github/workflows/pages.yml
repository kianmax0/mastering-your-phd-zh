name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_PAGES_VINEXT_STATIC_ROOT: "true"

      - name: Normalize static asset paths
        if: steps.pages.outputs.base_path != ''
        run: |
          mv "dist/client${PAGES_BASE_PATH}/_next" dist/client/_next
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify static export
        run: |
          test -f dist/client/index.html
          test -d dist/client/_next

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
